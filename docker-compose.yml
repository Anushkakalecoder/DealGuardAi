services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dealguard
      POSTGRES_USER: dealguard
      POSTGRES_PASSWORD: dealguard
    ports: ["5432:5432"]
    volumes: ["dealguard_pg:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://dealguard:dealguard@db:5432/dealguard
      FRONTEND_ORIGIN: http://localhost:5173
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: openai/gpt-oss-120b
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  dealguard_pg:
